name: Eseguibili (Windows, Mac, Linux)

# A ogni push compila il gioco per i 3 sistemi e prova l'app impacchettata (senza finestre).
# Con un tag di versione (es. v1.0.0) pubblica anche una Release con i file da scaricare.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dipendenze
        run: npm ci

      - name: Controllo dei tipi
        run: npm run typecheck

      - name: Display virtuale (solo Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libfuse2

      - name: Compila l'eseguibile
        run: npm run desktop:build
        env:
          # Nessuna firma: i certificati di Apple e Microsoft sono a pagamento.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Prova l'app impacchettata
        run: npm run desktop:smoke

      - uses: actions/upload-artifact@v4
        with:
          name: gioco-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
            build/LEGGIMI.txt
          generate_release_notes: true
