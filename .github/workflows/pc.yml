name: Eseguibili (Windows, Mac, Linux)

# Compila il gioco per i 3 sistemi e prova l'app impacchettata (senza finestre).
# Parte con un tag di versione (es. v1.0.0, e allora pubblica anche la Release), quando cambia la parte desktop,
# oppure a mano da GitHub → Actions → «Run workflow». I controlli di ogni push li fa ci.yml (più veloce).
on:
  push:
    branches: [main, master]
    tags: ['pc-v*']
    paths:
      - 'desktop/**'
      - 'electron-builder.config.cjs'
      - 'scripts/desktop-*.mjs'
      - 'build/**'
      - 'package-lock.json'
      - '.github/workflows/pc.yml'
  # chiamato dalla release (release.yml)
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dipendenze
        run: npm ci

      - name: Controllo dei tipi
        run: npm run typecheck

      - name: Display virtuale (solo Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libfuse2

      - name: Compila l'eseguibile
        run: npm run desktop:build
        env:
          # Nessuna firma: i certificati di Apple e Microsoft sono a pagamento.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Prova l'app impacchettata
        run: npm run desktop:smoke

      - uses: actions/upload-artifact@v4
        with:
          name: gioco-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/pc-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
            build/LEGGIMI.txt
          generate_release_notes: true
