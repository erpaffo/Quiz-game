name: Release (verifica AI, poi telefono e PC)

# Si attiva con un tag di versione: git tag v0.3.0 && git push --tags
# 1) verifica AI delle domande con DeepSeek; 2) solo se passa, pubblica l'app telefono e gli eseguibili PC.
# Per il solo telefono o il solo PC: tag telefono-v* o pc-v*, oppure «Run workflow» sui singoli file.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifica-ai:
    uses: ./.github/workflows/verifica-ai.yml
    secrets: inherit

  telefono:
    needs: verifica-ai
    uses: ./.github/workflows/telefono.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  pc:
    needs: verifica-ai
    uses: ./.github/workflows/pc.yml
    permissions:
      contents: write
