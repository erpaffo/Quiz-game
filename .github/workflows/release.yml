name: Release (telefono e PC)

# Si attiva con un tag di versione: git tag v0.3.0 && git push --tags
# Pubblica l'app telefono e gli eseguibili PC (con la Release su GitHub). La verifica AI delle domande NON fa parte della release:
# gira per conto suo quando cambiano le domande (verifica-ai.yml).
# Per il solo telefono o il solo PC: tag telefono-v* o pc-v*, oppure «Run workflow» sui singoli file.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  telefono:
    uses: ./.github/workflows/telefono.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  pc:
    uses: ./.github/workflows/pc.yml
    permissions:
      contents: write
